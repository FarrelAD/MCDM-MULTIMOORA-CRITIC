[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcdm-multimoora-critic"
version = "0.1.0"
description = "Multi-Criteria Decision Making using MULTIMOORA and CRITIC weighting"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "MCDM-MULTIMOORA-CRITIC Contributors" }
]
dependencies = [
    "numpy>=1.20.0",
    "pymcdm>=1.3.0",
    "tabulate>=0.9.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]

[project.scripts]
multimoora-critic = "multimoora_critic.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
